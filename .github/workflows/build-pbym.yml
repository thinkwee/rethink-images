name: build-pbym-images
# Images for "Predict Before You Modify" (arXiv 2610.13991). The official code is published only as an anonymous
# mirror (no git), as a zip that the mirror rebuilds on every download (zip bytes differ), so the pin is the sha256
# over the sorted per-file sha256 list of the unpacked tree.
#  - controller: experiments/coding/runtime/Dockerfile, built unmodified with its own folder as context
#  - Polyglot evaluation images (base, env, one per exercise): the official dataset script and build functions,
#    unchanged, with the two settings the official launcher sets (experiments/coding/runner.py:75:
#    POLYGLOT_SANITIZE_DOMAINS=1, POLYGLOT_EVALUATOR_VERSION=v2). The prepared dataset is published as a release asset.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/build-pbym.yml", "scripts/build_polyglot.py"]
permissions:
  contents: write
  packages: write
env:
  SOURCE: https://anonymous.4open.science/r/Predictive-self-evolution/
  TREE_SHA256: fb91fcb6795dd27a4a6538e8b0f653532a96613af1c5c40ee7206b5d831b958d
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # the mirror answers CI runners with a Cloudflare bot check ("Just a moment..."), so the zip downloaded from the
      # mirror is kept in a private cache repository; the unpacked tree is still checked against the pinned sha256
      - uses: actions/checkout@v4
        with: {repository: thinkwee/rethink-src-cache, ssh-key: "${{ secrets.SRC_CACHE_SSH_KEY }}", path: cache}
      - name: Unpack the official code (tree sha256-checked)
        run: |
          mkdir src && cd src && unzip -q ../cache/predictive-self-evolution.zip
          got=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-64)
          echo "tree sha256: $got"; [ "$got" = "$TREE_SHA256" ]
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build and push the controller image
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/rethink-pbym:${TREE_SHA256}
          docker build -t "$IMG" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="Unmodified experiments/coding/runtime/Dockerfile of Predictive-self-evolution (tree sha256 ${TREE_SHA256})" \
            src/experiments/coding/runtime
          docker run --rm "$IMG" python -c "import sys, litellm; print(sys.version)"
          docker push "$IMG"
  polyglot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af; df -h /
      - uses: actions/checkout@v4
        with: {path: tools}
      # the mirror answers CI runners with a Cloudflare bot check ("Just a moment..."), so the zip downloaded from the
      # mirror is kept in a private cache repository; the unpacked tree is still checked against the pinned sha256
      - uses: actions/checkout@v4
        with: {repository: thinkwee/rethink-src-cache, ssh-key: "${{ secrets.SRC_CACHE_SSH_KEY }}", path: cache}
      - name: Unpack the official code (tree sha256-checked)
        run: |
          mkdir src && cd src && unzip -q ../cache/predictive-self-evolution.zip
          got=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-64)
          echo "tree sha256: $got"; [ "$got" = "$TREE_SHA256" ]
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install (the packages the dataset and build steps import; no SWE-bench, which no Polyglot spec uses)
        working-directory: src
        run: |
          git config --global user.email "ci@example.com"; git config --global user.name "ci"
          pip install docker GitPython unidiff rich tqdm python-dotenv chardet datasets
      - name: Prepare dataset (official script, docs/reproduction.md)
        working-directory: src
        run: python -B -m domains.polyglot.prepare_polyglot_dataset
      - name: Build images (official build functions, launcher settings)
        working-directory: src
        env: {POLYGLOT_SANITIZE_DOMAINS: "1", POLYGLOT_EVALUATOR_VERSION: "v2"}
        run: PYTHONPATH=. python ../tools/scripts/build_polyglot.py domains.polyglot domains/polyglot/polyglot_benchmark_metadata.json
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Push (tag = official tag with ':latest' dropped)
        working-directory: src
        run: |
          DEST=ghcr.io/${{ github.repository_owner }}/rethink-pb-pbym
          for t in $(python -c "import json;print(' '.join(json.load(open('pb_tags.json'))))"); do
            nt="${t%:latest}"; nt="${nt//:/-}"
            docker tag "$t" "$DEST:$nt"; docker push -q "$DEST:$nt"
          done
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^pb\.' | head -5
      - name: Package and publish the prepared dataset
        working-directory: src
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          TAG=polyglot-pbym-${TREE_SHA256}
          tar czf ../$TAG.tar.gz domains/polyglot/polyglot-benchmark domains/polyglot/polyglot_benchmark_metadata.json pb_tags.json
          gh release create "$TAG" -R ${{ github.repository }} --title "$TAG" --notes "Prepared Polyglot dataset for Predictive-self-evolution (tree sha256 ${TREE_SHA256})" ../$TAG.tar.gz || \
          gh release upload "$TAG" -R ${{ github.repository }} --clobber ../$TAG.tar.gz
