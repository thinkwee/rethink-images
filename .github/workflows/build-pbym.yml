name: build-pbym-images
# Images for "Predict Before You Modify" (arXiv 2610.13991). The official code is published only as an anonymous
# mirror (no git), so it is fetched as a zip and checked against a pinned sha256.
#  - controller: experiments/coding/runtime/Dockerfile, built unmodified with its own folder as context
#  - Polyglot evaluation images (base, env, one per exercise): the official dataset script and build functions,
#    unchanged, with the two settings the official launcher sets (experiments/coding/runner.py:75:
#    POLYGLOT_SANITIZE_DOMAINS=1, POLYGLOT_EVALUATOR_VERSION=v2). The prepared dataset is published as a release asset.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/build-pbym.yml", "scripts/build_polyglot.py"]
permissions:
  contents: write
  packages: write
env:
  ZIP_URL: https://anonymous.4open.science/api/repo/Predictive-self-evolution/zip
  ZIP_SHA256: 04b2b1d4b15847ae8f490a717e0d59e59a5980712ce5c86e6d290267c9a42b48
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch the official code (sha256-checked)
        run: |
          curl -sSL --retry 5 -o src.zip "$ZIP_URL"
          echo "$ZIP_SHA256  src.zip" | sha256sum -c -
          mkdir src && cd src && unzip -q ../src.zip
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build and push the controller image
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/rethink-pbym:${ZIP_SHA256}
          docker build -t "$IMG" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="Unmodified experiments/coding/runtime/Dockerfile of Predictive-self-evolution (zip sha256 ${ZIP_SHA256})" \
            src/experiments/coding/runtime
          docker run --rm "$IMG" python -c "import sys, litellm; print(sys.version)"
          docker push "$IMG"
  polyglot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af; df -h /
      - uses: actions/checkout@v4
        with: {path: tools}
      - name: Fetch the official code (sha256-checked)
        run: |
          curl -sSL --retry 5 -o src.zip "$ZIP_URL"
          echo "$ZIP_SHA256  src.zip" | sha256sum -c -
          mkdir src && cd src && unzip -q ../src.zip
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install (the packages the dataset and build steps import; no SWE-bench, which no Polyglot spec uses)
        working-directory: src
        run: |
          git config --global user.email "ci@example.com"; git config --global user.name "ci"
          pip install docker GitPython unidiff rich tqdm python-dotenv chardet datasets
      - name: Prepare dataset (official script, docs/reproduction.md)
        working-directory: src
        run: python -B -m domains.polyglot.prepare_polyglot_dataset
      - name: Build images (official build functions, launcher settings)
        working-directory: src
        env: {POLYGLOT_SANITIZE_DOMAINS: "1", POLYGLOT_EVALUATOR_VERSION: "v2"}
        run: PYTHONPATH=. python ../tools/scripts/build_polyglot.py domains.polyglot domains/polyglot/polyglot_benchmark_metadata.json
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Push (tag = official tag with ':latest' dropped)
        working-directory: src
        run: |
          DEST=ghcr.io/${{ github.repository_owner }}/rethink-pb-pbym
          for t in $(python -c "import json;print(' '.join(json.load(open('pb_tags.json'))))"); do
            nt="${t%:latest}"; nt="${nt//:/-}"
            docker tag "$t" "$DEST:$nt"; docker push -q "$DEST:$nt"
          done
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^pb\.' | head -5
      - name: Package and publish the prepared dataset
        working-directory: src
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          TAG=polyglot-pbym-${ZIP_SHA256}
          tar czf ../$TAG.tar.gz domains/polyglot/polyglot-benchmark domains/polyglot/polyglot_benchmark_metadata.json pb_tags.json
          gh release create "$TAG" -R ${{ github.repository }} --title "$TAG" --notes "Prepared Polyglot dataset for Predictive-self-evolution (zip sha256 ${ZIP_SHA256})" ../$TAG.tar.gz || \
          gh release upload "$TAG" -R ${{ github.repository }} --clobber ../$TAG.tar.gz
